spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:mysql://localhost:3307/authdb
    username: root
    password: root123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer

    properties:
      schema.registry.url: http://localhost:9081

server:
  port: 8086

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

#Zipkin
management:
  tracing:
    sampling:
      probability: 1.0

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}